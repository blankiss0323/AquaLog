<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AquaLog">
<title>AquaLog - アクアリウム管理</title>
<style>
:root {
  --bg: #0c1926;
  --card: #12283d;
  --border: #1e3a54;
  --accent: #3a8ab8;
  --text: #d1e3ef;
  --sub: #4a7a96;
  --blue: #7eb8d8;
  --good: #22c55e;
  --warn: #eab308;
  --danger: #ef4444;
  --btn: #1a5276;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, 'Hiragino Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}
.header {
  background: linear-gradient(135deg, #0f2235, #162d45);
  padding: 12px 16px;
  padding-top: calc(env(safe-area-inset-top, 12px) + 8px);
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 17px; color: var(--blue); font-weight: 700; }
.header p { font-size: 11px; color: var(--sub); margin-top: 1px; }
.tabs {
  display: flex;
  background: #0f2235;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}
.tab {
  flex: 1;
  padding: 10px 2px;
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  font-weight: 400;
  font-family: inherit;
}
.tab.active {
  color: var(--blue);
  background: #162d45;
  border-bottom-color: var(--accent);
  font-weight: 700;
}
.content { padding: 12px; }
.card {
  background: var(--card);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.card-title {
  font-size: 14px;
  color: var(--blue);
  font-weight: 700;
  margin-bottom: 10px;
}
.tank-selector {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.tank-btn {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.tank-btn.active {
  border-color: var(--accent);
  background: #1a3550;
  color: var(--blue);
}
.alert {
  padding: 6px 10px;
  margin-bottom: 4px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
}
.alert-danger {
  background: rgba(239,68,68,0.15);
  color: #f87171;
  border-left: 3px solid var(--danger);
}
.alert-warn {
  background: rgba(234,179,8,0.12);
  color: #fbbf24;
  border-left: 3px solid var(--warn);
}
.alert-good {
  background: rgba(34,197,94,0.1);
  color: #4ade80;
  border-left: 3px solid var(--good);
}
.values-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}
.value-cell {
  background: var(--bg);
  border-radius: 8px;
  padding: 8px 4px;
  text-align: center;
}
.value-label { font-size: 10px; color: var(--sub); margin-bottom: 2px; }
.value-num { font-size: 16px; font-weight: 700; }
.meta-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--sub);
}
.input-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}
.input-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}
.input-group label {
  font-size: 10px;
  color: var(--sub);
  display: block;
  margin-bottom: 3px;
}
.input-group input, .input-group select {
  width: 100%;
  padding: 8px 4px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 14px;
  text-align: center;
  outline: none;
  font-family: inherit;
}
.input-memo {
  width: 100%;
  padding: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  margin-bottom: 10px;
  outline: none;
  font-family: inherit;
}
.btn {
  width: 100%;
  padding: 11px;
  background: var(--btn);
  color: var(--blue);
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.btn:active { opacity: 0.8; }
.btn-success { background: #166534; color: #4ade80; }
.history-item {
  background: var(--card);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 6px;
  border: 1px solid var(--border);
}
.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.history-date { font-size: 11px; color: var(--sub); }
.delete-btn {
  background: none;
  border: none;
  color: var(--sub);
  font-size: 16px;
  cursor: pointer;
  padding: 2px 6px;
}
.tag {
  display: inline-block;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
  margin-right: 4px;
  margin-bottom: 2px;
}
.history-note { font-size: 11px; color: var(--sub); margin-top: 4px; }
.section-title {
  font-size: 13px;
  color: var(--blue);
  margin: 14px 0 8px;
  font-weight: 700;
}
.section-title:first-child { margin-top: 0; }
.empty {
  background: var(--card);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  color: var(--sub);
  font-size: 12px;
  border: 1px solid var(--border);
}
.export-preview {
  font-size: 10px;
  color: var(--sub);
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
  font-family: 'SF Mono', 'Menlo', monospace;
}
details { background: var(--card); border-radius: 12px; border: 1px solid var(--border); }
summary {
  padding: 12px 14px;
  font-size: 13px;
  color: var(--blue);
  cursor: pointer;
  font-weight: 600;
}
.safe-line {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--sub);
  padding: 2px 0;
}
.schedule-card {
  background: var(--bg);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 6px;
}
.schedule-title { font-size: 12px; color: var(--blue); font-weight: 600; }
.schedule-detail { font-size: 11px; color: var(--sub); margin-top: 3px; }
.canvas-container { width: 100%; overflow-x: auto; }
canvas { display: block; }
</style>
</head>
<body>

<div class="header">
  <h1>🐟 AquaLog</h1>
  <p>水質管理・換水記録・スケジュール</p>
</div>

<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>

<script>
// === DATA ===
const TANKS = {
  perco: {
    id:'perco', name:'PERCO', subtitle:'ミッキー（赤プラティ）', emoji:'🐠',
    limits: {
      NO3:{safe:[0,50],ideal:[0,25]}, NO2:{safe:[0,0],ideal:[0,0]},
      GH:{safe:[4,12],ideal:[4,8]}, KH:{safe:[2,10],ideal:[2,6]},
      pH:{safe:[6.5,8.0],ideal:[6.8,7.5]}, Cl2:{safe:[0,0],ideal:[0,0]},
      NH3:{safe:[0,0.02],ideal:[0,0]}
    }
  },
  sub: {
    id:'sub', name:'サブ水槽', subtitle:'ベル＆フィガロ＋エビ', emoji:'🦐',
    limits: {
      NO3:{safe:[0,30],ideal:[0,25]}, NO2:{safe:[0,0],ideal:[0,0]},
      GH:{safe:[4,8],ideal:[4,6]}, KH:{safe:[2,8],ideal:[2,6]},
      pH:{safe:[6.0,7.5],ideal:[6.5,7.0]}, Cl2:{safe:[0,0],ideal:[0,0]},
      NH3:{safe:[0,0.02],ideal:[0,0]}
    }
  }
};
const PARAMS = ['NO3','NO2','GH','KH','pH','Cl2','NH3'];
const PARAM_COLORS = {NO3:'#e07a3a',NO2:'#d94040',GH:'#5b8fb9',KH:'#7b6fb0',pH:'#3a9e6e',Cl2:'#8fad5e',NH3:'#c75d8a'};

// === STORAGE ===
function loadData(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e) { return []; } }
function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

let qualityLogs = loadData('aq-quality');
let changeLogs = loadData('aq-changes');
let activeTab = 'dashboard';
let activeTank = 'perco';
let formTank = 'perco';

// === HELPERS ===
function fmtDate(d) { const dt=new Date(d); return `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`; }
function fmtShort(d) { const dt=new Date(d); return `${dt.getMonth()+1}/${dt.getDate()}`; }
function daysSince(d) {
  if(!d) return null;
  const diff = Date.now() - new Date(d).getTime();
  const h = Math.floor(diff/3600000);
  if(h<24) return h+'時間前';
  return Math.floor(diff/86400000)+'日前';
}
function getStatus(v, lim) {
  if(v===''||v===null||v===undefined) return 'none';
  const n=parseFloat(v); if(isNaN(n)) return 'none';
  if(lim.safe[1]===0&&lim.safe[0]===0) return n===0?'good':'danger';
  if(n<lim.safe[0]||n>lim.safe[1]) return 'danger';
  if(n<lim.ideal[0]||n>lim.ideal[1]) return 'warn';
  return 'good';
}
function statusColor(s) { return {good:'#22c55e',warn:'#eab308',danger:'#ef4444',none:'#94a3b8'}[s]; }
function getLatest(tid) { return qualityLogs.filter(l=>l.tank===tid).slice(-1)[0]||null; }
function getLastChange(tid) { return changeLogs.filter(l=>l.tank===tid).slice(-1)[0]||null; }
function getAlerts(tid) {
  const latest=getLatest(tid), tank=TANKS[tid], alerts=[];
  if(!latest) return [{type:'warn',msg:'水質データなし'}];
  PARAMS.forEach(p=>{
    if(latest[p]!==''&&latest[p]!==undefined&&latest[p]!==null){
      const st=getStatus(latest[p],tank.limits[p]);
      if(st==='danger') alerts.push({type:'danger',msg:`${p}: ${latest[p]} — 危険域！即対応`});
      else if(st==='warn') alerts.push({type:'warn',msg:`${p}: ${latest[p]} — 注意域`});
    }
  });
  const lc=getLastChange(tid);
  if(lc){ const dd=(Date.now()-new Date(lc.date).getTime())/86400000;
    if(tid==='perco'&&dd>3) alerts.push({type:'warn',msg:`換水から${Math.floor(dd)}日経過`});
    if(tid==='sub'&&dd>7) alerts.push({type:'warn',msg:`換水から${Math.floor(dd)}日経過`});
  }
  return alerts;
}

// === RENDER ===
function renderTabs() {
  const tabs=[{id:'dashboard',label:'状態'},{id:'log',label:'記録'},{id:'chart',label:'推移'},{id:'history',label:'履歴'},{id:'export',label:'出力'}];
  document.getElementById('tabs').innerHTML = tabs.map(t=>
    `<button class="tab${activeTab===t.id?' active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
}

function switchTab(id) { activeTab=id; renderTabs(); renderContent(); }
function switchTank(id) { activeTank=id; renderContent(); }
function switchFormTank(id) { formTank=id; renderContent(); }

function renderContent() {
  const el=document.getElementById('content');
  if(activeTab==='dashboard') el.innerHTML=renderDashboard();
  else if(activeTab==='log') el.innerHTML=renderLog();
  else if(activeTab==='chart') el.innerHTML=renderChart();
  else if(activeTab==='history') el.innerHTML=renderHistory();
  else if(activeTab==='export') el.innerHTML=renderExport();
  if(activeTab==='chart') drawCharts();
}

function renderDashboard() {
  let html='';
  Object.values(TANKS).forEach(tank=>{
    const latest=getLatest(tank.id), lc=getLastChange(tank.id), alerts=getAlerts(tank.id);
    html+=`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><span style="font-size:16px">${tank.emoji}</span>
        <span style="font-size:15px;font-weight:700;color:var(--blue);margin-left:6px">${tank.name}</span>
        <span style="font-size:11px;color:var(--sub);margin-left:8px">${tank.subtitle}</span></div>
      </div>`;
    if(alerts.length>0) {
      alerts.forEach(a=>{ html+=`<div class="alert alert-${a.type}">${a.type==='danger'?'⚠️':'💡'} ${a.msg}</div>`; });
    } else {
      html+=`<div class="alert alert-good">✅ 全項目セーフ</div>`;
    }
    if(latest) {
      html+=`<div class="values-grid" style="margin-top:10px">`;
      PARAMS.filter(p=>latest[p]!==''&&latest[p]!==undefined&&latest[p]!==null).forEach(p=>{
        const st=getStatus(latest[p],tank.limits[p]);
        html+=`<div class="value-cell" style="border:1px solid ${statusColor(st)}30">
          <div class="value-label">${p}</div>
          <div class="value-num" style="color:${statusColor(st)}">${latest[p]}</div>
        </div>`;
      });
      html+=`</div>`;
    }
    html+=`<div class="meta-row"><span>測定: ${latest?daysSince(latest.date):'未測定'}</span><span>換水: ${lc?daysSince(lc.date):'未実施'}</span></div>`;
    html+=`</div>`;
  });
  // Safe line reference
  html+=`<details><summary>📊 セーフライン一覧</summary><div style="padding:0 14px 14px">`;
  Object.values(TANKS).forEach(tank=>{
    html+=`<div style="margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:4px">${tank.emoji} ${tank.name}</div>`;
    PARAMS.forEach(p=>{
      html+=`<div class="safe-line"><span>${p}</span><span>理想: ${tank.limits[p].ideal[0]}〜${tank.limits[p].ideal[1]} / 限界: ${tank.limits[p].safe[0]}〜${tank.limits[p].safe[1]}</span></div>`;
    });
    html+=`</div>`;
  });
  html+=`</div></details>`;
  return html;
}

function renderLog() {
  const tanks=Object.values(TANKS);
  let html=`<div class="tank-selector">${tanks.map(t=>
    `<button class="tank-btn${formTank===t.id?' active':''}" onclick="switchFormTank('${t.id}')">${t.emoji} ${t.name}</button>`
  ).join('')}</div>`;

  // Water quality form
  html+=`<div class="card"><div class="card-title">💧 水質記録</div>
    <div class="input-grid">`;
  PARAMS.forEach(p=>{
    html+=`<div class="input-group"><label>${p}</label><input type="number" step="0.1" id="q_${p}" placeholder="-"></div>`;
  });
  html+=`</div>
    <input type="text" class="input-memo" id="q_note" placeholder="メモ（任意）">
    <button class="btn" onclick="addQuality()">記録する</button></div>`;

  // Water change form
  html+=`<div class="card"><div class="card-title">🔄 換水記録</div>
    <div class="input-grid-2">
      <div class="input-group"><label>換水量 (L)</label><input type="number" step="0.1" id="c_volume" placeholder="1.0"></div>
      <div class="input-group"><label>水温 (℃)</label><input type="number" step="0.1" id="c_temp" placeholder="30.0"></div>
    </div>
    <input type="text" class="input-memo" id="c_note" placeholder="メモ（底砂掃除エリアなど）">
    <button class="btn" onclick="addChange()">記録する</button></div>`;

  return html;
}

function addQuality() {
  const entry = { id:Date.now(), date:new Date().toISOString(), tank:formTank };
  PARAMS.forEach(p=>{ entry[p]=document.getElementById('q_'+p).value; });
  entry.note=document.getElementById('q_note').value;
  qualityLogs.push(entry);
  qualityLogs.sort((a,b)=>new Date(a.date)-new Date(b.date));
  saveData('aq-quality',qualityLogs);
  PARAMS.forEach(p=>{ document.getElementById('q_'+p).value=''; });
  document.getElementById('q_note').value='';
  // Show brief feedback
  const btn=event.target; btn.textContent='✅ 記録完了！'; btn.classList.add('btn-success');
  setTimeout(()=>{ btn.textContent='記録する'; btn.classList.remove('btn-success'); renderContent(); },1200);
}

function addChange() {
  const entry = { id:Date.now(), date:new Date().toISOString(), tank:formTank,
    volume:document.getElementById('c_volume').value,
    temp:document.getElementById('c_temp').value,
    note:document.getElementById('c_note').value };
  changeLogs.push(entry);
  changeLogs.sort((a,b)=>new Date(a.date)-new Date(b.date));
  saveData('aq-changes',changeLogs);
  document.getElementById('c_volume').value='';
  document.getElementById('c_temp').value='';
  document.getElementById('c_note').value='';
  const btn=event.target; btn.textContent='✅ 記録完了！'; btn.classList.add('btn-success');
  setTimeout(()=>{ btn.textContent='記録する'; btn.classList.remove('btn-success'); renderContent(); },1200);
}

function renderChart() {
  const tanks=Object.values(TANKS);
  let html=`<div class="tank-selector">${tanks.map(t=>
    `<button class="tank-btn${activeTank===t.id?' active':''}" onclick="switchTank('${t.id}')">${t.emoji} ${t.name}</button>`
  ).join('')}</div>`;

  const data=qualityLogs.filter(l=>l.tank===activeTank);
  if(data.length<2) {
    html+=`<div class="empty">データが2件以上必要です。記録を続けてください。</div>`;
    return html;
  }

  html+=`<div class="card"><div class="card-title">NO3 / NO2</div>
    <div class="canvas-container"><canvas id="chart1" width="340" height="180"></canvas></div></div>`;
  html+=`<div class="card"><div class="card-title">GH / KH / pH</div>
    <div class="canvas-container"><canvas id="chart2" width="340" height="180"></canvas></div></div>`;

  const hasNH3 = data.some(d=>d.NH3!==''&&d.NH3!==undefined&&d.NH3!==null);
  if(hasNH3) {
    html+=`<div class="card"><div class="card-title">NH3（アンモニア）</div>
      <div class="canvas-container"><canvas id="chart3" width="340" height="150"></canvas></div></div>`;
  }
  return html;
}

function drawCharts() {
  const data=qualityLogs.filter(l=>l.tank===activeTank);
  if(data.length<2) return;

  const labels=data.map(d=>fmtShort(d.date));
  const w=Math.max(340, labels.length*50);

  // Chart 1: NO3/NO2
  drawLineChart('chart1', w, 180, labels, [
    {key:'NO3',color:PARAM_COLORS.NO3,data:data.map(d=>d.NO3!==''?parseFloat(d.NO3):null)},
    {key:'NO2',color:PARAM_COLORS.NO2,data:data.map(d=>d.NO2!==''?parseFloat(d.NO2):null)}
  ], TANKS[activeTank].limits.NO3.safe[1]);

  // Chart 2: GH/KH/pH
  drawLineChart('chart2', w, 180, labels, [
    {key:'GH',color:PARAM_COLORS.GH,data:data.map(d=>d.GH!==''?parseFloat(d.GH):null)},
    {key:'KH',color:PARAM_COLORS.KH,data:data.map(d=>d.KH!==''?parseFloat(d.KH):null)},
    {key:'pH',color:PARAM_COLORS.pH,data:data.map(d=>d.pH!==''?parseFloat(d.pH):null)}
  ]);

  // Chart 3: NH3
  const hasNH3=data.some(d=>d.NH3!==''&&d.NH3!==undefined&&d.NH3!==null);
  if(hasNH3) {
    drawLineChart('chart3', w, 150, labels, [
      {key:'NH3',color:PARAM_COLORS.NH3,data:data.map(d=>d.NH3!==''&&d.NH3!==undefined?parseFloat(d.NH3):null)}
    ]);
  }
}

function drawLineChart(canvasId, w, h, labels, series, refLine) {
  const canvas=document.getElementById(canvasId);
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1;
  canvas.width=w*dpr; canvas.height=h*dpr;
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const pad={top:20,right:16,bottom:28,left:36};
  const cw=w-pad.left-pad.right, ch=h-pad.top-pad.bottom;

  // Find min/max
  let allVals=[];
  series.forEach(s=>s.data.forEach(v=>{if(v!==null&&!isNaN(v))allVals.push(v);}));
  if(refLine!==undefined) allVals.push(refLine);
  let min=Math.min(...allVals), max=Math.max(...allVals);
  if(min===max){min-=1;max+=1;}
  const range=max-min;
  min-=range*0.1; max+=range*0.1;

  // Grid
  ctx.strokeStyle='#1e3a54'; ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++){
    const y=pad.top+ch*(i/4);
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(w-pad.right,y); ctx.stroke();
    ctx.fillStyle='#4a7a96'; ctx.font='9px -apple-system';
    ctx.textAlign='right'; ctx.fillText((max-(max-min)*(i/4)).toFixed(1), pad.left-4, y+3);
  }

  // X labels
  ctx.fillStyle='#4a7a96'; ctx.font='9px -apple-system'; ctx.textAlign='center';
  labels.forEach((l,i)=>{
    const x=pad.left+(cw*i/(labels.length-1));
    ctx.fillText(l,x,h-6);
  });

  // Reference line
  if(refLine!==undefined){
    const ry=pad.top+ch*(1-(refLine-min)/(max-min));
    ctx.strokeStyle='rgba(239,68,68,0.3)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(pad.left,ry); ctx.lineTo(w-pad.right,ry); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Lines
  series.forEach(s=>{
    ctx.strokeStyle=s.color; ctx.lineWidth=2;
    ctx.beginPath();
    let started=false;
    s.data.forEach((v,i)=>{
      if(v===null||isNaN(v)) return;
      const x=pad.left+(cw*i/(labels.length-1));
      const y=pad.top+ch*(1-(v-min)/(max-min));
      if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y);
    });
    ctx.stroke();

    // Dots
    s.data.forEach((v,i)=>{
      if(v===null||isNaN(v)) return;
      const x=pad.left+(cw*i/(labels.length-1));
      const y=pad.top+ch*(1-(v-min)/(max-min));
      ctx.fillStyle=s.color; ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
    });

    // Legend
    const li=series.indexOf(s);
    ctx.fillStyle=s.color; ctx.font='bold 10px -apple-system'; ctx.textAlign='left';
    ctx.fillText(s.key, pad.left+li*50, 12);
  });
}

function renderHistory() {
  const tanks=Object.values(TANKS);
  let html=`<div class="tank-selector">${tanks.map(t=>
    `<button class="tank-btn${activeTank===t.id?' active':''}" onclick="switchTank('${t.id}')">${t.emoji} ${t.name}</button>`
  ).join('')}</div>`;

  const tank=TANKS[activeTank];
  html+=`<div class="section-title" style="margin-top:0">💧 水質履歴</div>`;
  const ql=qualityLogs.filter(l=>l.tank===activeTank).slice().reverse();
  if(ql.length===0) html+=`<div class="empty">記録なし</div>`;
  else ql.forEach(l=>{
    html+=`<div class="history-item"><div class="history-header">
      <span class="history-date">${fmtDate(l.date)}</span>
      <button class="delete-btn" onclick="delQuality(${l.id})">×</button></div><div>`;
    PARAMS.filter(p=>l[p]!==''&&l[p]!==undefined&&l[p]!==null).forEach(p=>{
      const st=getStatus(l[p],tank.limits[p]);
      html+=`<span class="tag" style="background:${statusColor(st)}18;color:${statusColor(st)}">${p}:${l[p]}</span>`;
    });
    html+=`</div>`;
    if(l.note) html+=`<div class="history-note">📝 ${l.note}</div>`;
    html+=`</div>`;
  });

  html+=`<div class="section-title">🔄 換水履歴</div>`;
  const cl=changeLogs.filter(l=>l.tank===activeTank).slice().reverse();
  if(cl.length===0) html+=`<div class="empty">記録なし</div>`;
  else cl.forEach(l=>{
    html+=`<div class="history-item"><div class="history-header">
      <span class="history-date">${fmtDate(l.date)}</span>
      <button class="delete-btn" onclick="delChange(${l.id})">×</button></div>
      <div style="display:flex;gap:10px;margin-top:4px">`;
    if(l.volume) html+=`<span style="font-size:12px;color:var(--blue);font-weight:600">💧 ${l.volume}L</span>`;
    if(l.temp) html+=`<span style="font-size:12px;color:var(--blue);font-weight:600">🌡 ${l.temp}℃</span>`;
    html+=`</div>`;
    if(l.note) html+=`<div class="history-note">📝 ${l.note}</div>`;
    html+=`</div>`;
  });
  return html;
}

function delQuality(id) {
  qualityLogs=qualityLogs.filter(l=>l.id!==id);
  saveData('aq-quality',qualityLogs);
  renderContent();
}
function delChange(id) {
  changeLogs=changeLogs.filter(l=>l.id!==id);
  saveData('aq-changes',changeLogs);
  renderContent();
}

function renderExport() {
  const text=exportText();
  return `<div class="card">
    <div class="card-title">📋 Claude用エクスポート</div>
    <p style="font-size:12px;color:var(--sub);margin-bottom:12px">直近5件の水質・換水データをClaudeに貼り付けられる形式でコピーします。</p>
    <button class="btn" id="exportBtn" onclick="copyExport()">クリップボードにコピー</button>
  </div>
  <div class="card">
    <div class="card-title">プレビュー</div>
    <pre class="export-preview">${escHtml(text)}</pre>
  </div>`;
}

function exportText() {
  function tankBlock(tid) {
    const t=TANKS[tid];
    const ql=qualityLogs.filter(l=>l.tank===tid).slice(-5);
    const cl=changeLogs.filter(l=>l.tank===tid).slice(-5);
    let s=`## ${t.name}（${t.subtitle}）\n### 水質ログ（直近5件）\n日時 | NO3 | NO2 | GH | KH | pH | Cl2 | NH3 | メモ\n`;
    ql.forEach(l=>{
      s+=`${fmtDate(l.date)} | ${l.NO3||'-'} | ${l.NO2||'-'} | ${l.GH||'-'} | ${l.KH||'-'} | ${l.pH||'-'} | ${l.Cl2||'-'} | ${l.NH3||'-'} | ${l.note||'-'}\n`;
    });
    if(ql.length===0) s+='データなし\n';
    s+=`### 換水ログ（直近5件）\n日時 | 量 | 水温 | メモ\n`;
    cl.forEach(l=>{ s+=`${fmtDate(l.date)} | ${l.volume||'-'}L | ${l.temp||'-'}℃ | ${l.note||'-'}\n`; });
    if(cl.length===0) s+='データなし\n';
    return s;
  }
  return `# アクアリウム管理データ（${fmtDate(new Date())}）\n\n${tankBlock('perco')}\n${tankBlock('sub')}`;
}

function copyExport() {
  const text=exportText();
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById('exportBtn');
    btn.textContent='✅ コピー完了！'; btn.classList.add('btn-success');
    setTimeout(()=>{btn.textContent='クリップボードにコピー';btn.classList.remove('btn-success');},2000);
  }).catch(()=>{
    // Fallback
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    const btn=document.getElementById('exportBtn');
    btn.textContent='✅ コピー完了！'; btn.classList.add('btn-success');
    setTimeout(()=>{btn.textContent='クリップボードにコピー';btn.classList.remove('btn-success');},2000);
  });
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// === INIT ===
renderTabs();
renderContent();
</script>
